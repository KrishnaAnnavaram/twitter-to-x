[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twitter-to-x"
version = "0.1.0"
description = "Sentiment and moderation talk before and after Twitter became X"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.40"]
vader = ["vaderSentiment>=3.3"]
parquet = ["pyarrow>=14"]
all = ["twitter-to-x[hf,vader,parquet]"]
dev = ["pytest>=8"]

[project.scripts]
twitter-to-x = "twitter_to_x.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
twitter_to_x = ["moderation/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
